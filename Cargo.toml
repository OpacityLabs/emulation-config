[package]
name = "emulation-config"
version = "0.4.0"
edition = "2024"
description = "Plain-data emulation configs for wreq, in the SDK's JSON wire format"
publish = false

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[dependencies]
# The certificate compressors wreq registers (RFC 8879). Same major lines as opacity-core's
# `async-compression`, so a build with both has one copy of each.
brotli = "8.0.4"
bytes = "1.12.1"
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
zstd = "0.13.3"
# Every 0.4.x release pins this wreq tag. A project using this crate must use the same wreq (see
# "Versions and wreq" in the README).
wreq = { version = "0.16.3-opacity.1", git = "https://github.com/OpacityLabs/wreq", tag = "v0.16.3-opacity.1", default-features = false, features = ["tokio-rt"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tokio = { version = "1.53.1", features = ["rt", "io-util"] }
# The http2 wreq uses, so tests can check which values its builder panics on. Keep the pin equal
# to the one in wreq's Cargo.toml, so both resolve to the same crate.
wreq_http2 = { version = "=0.5.20", package = "http2", features = ["unstable"] }
